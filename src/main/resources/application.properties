# ===================================================================
# 🐘 POSTGRESQL DATABASE CONFIGURATION
# ===================================================================
spring.application.name=fintrace
spring.datasource.url=jdbc:postgresql://localhost:5432/fintrace
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# 🏗️ JPA / HIBERNATE CONFIGURATION
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL Logging & Formatting (Invaluable for debugging queries)
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Open-Session-In-View optimization (Prevents unnecessary database connections hanging open)
spring.jpa.open-in-view=false

# ===================================================================
# 🚀 SERVER CONFIGURATION
# ===================================================================
server.port=8080
server.servlet.context-path=/api


# Connection Pool Settings (HikariCP - Production Standard)
# spring.datasource.hikari.minimum-idle=5
# spring.datasource.hikari.maximum-pool-size=20
# spring.datasource.hikari.idle-timeout=30000
# spring.datasource.hikari.max-lifetime=2000000
# spring.datasource.hikari.connection-timeout=30000


# ===================================================================
# 📁 SCHEMA DIRECTION (Choose Option A or Option B)
# ===================================================================
# OPTION A: If you are sticking with the default 'public' schema, leave this alone.
# OPTION B: If you decided to use a custom schema, uncomment the line below:
# spring.jpa.properties.hibernate.default_schema=billing
logging.level.org.springframework.web=DEBUG
